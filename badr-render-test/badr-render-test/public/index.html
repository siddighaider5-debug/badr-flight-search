<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بحث رحلات بدر للطيران</title><style>body{margin:0;background:#f3f6f8;font-family:Arial;color:#fff}.box{margin:70px auto;max-width:1000px;padding:40px;background:linear-gradient(120deg,#0b304e,#0786bd);border-radius:22px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{font-weight:bold}input,select,button{box-sizing:border-box;width:100%;margin-top:8px;border:0;border-radius:10px;padding:14px;font-size:16px}button{background:#91ce36;font-weight:bold;cursor:pointer}.note{font-size:13px}.results{margin-top:24px;display:grid;gap:12px}.card{background:#fff;color:#17324b;padding:18px;border-radius:12px}.price{font-weight:bold;color:#087d38}@media(max-width:700px){.box{margin:15px;padding:22px}.row{grid-template-columns:1fr}}</style></head><body><main class="box"><h1>ابحث عن رحلات بدر للطيران</h1><p>أدخل خط السير والتاريخ لعرض الرحلات المتاحة.</p><form id="form"><div class="row"><label>من<input name="origin" placeholder="JED" maxlength="3" required></label><label>إلى<input name="destination" placeholder="KRT" maxlength="3" required></label><label>تاريخ السفر<input name="date" type="date" required></label><label>عدد البالغين<select name="adults"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label></div><button>بحث عن الرحلات</button><p class="note">اكتب رمز المطار من 3 حروف، مثل JED لجدة وKRT للخرطوم.</p></form><div id="results" class="results"></div></main><script>const f=document.querySelector('#form'),r=document.querySelector('#results');f.addEventListener('submit',async e=>{e.preventDefault();r.textContent='جارٍ البحث...';const q=new URLSearchParams(new FormData(f));try{const x=await fetch('/api/search-badr?'+q);const d=await x.json();if(!x.ok)throw Error(d.message);r.innerHTML=d.flights.length?d.flights.map(a=>`<div class="card"><b>${a.title}</b><p>${a.details}</p><span class="price">${a.price||''}</span></div>`).join(''):'لا توجد رحلات متاحة لهذه البيانات.'}catch(e){r.textContent=e.message}})</script></body></html>
